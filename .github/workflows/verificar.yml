name: Verificación Android

on:
  push:
    branches: [develop, main, "feature/**", "fix/**", "test/**", "sc-**"]
  pull_request:
    branches: [develop, main]

jobs:
  android-host:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar plataforma Android
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Probar código común y generar APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:testAndroidHostTest :androidApp:assembleDebug
